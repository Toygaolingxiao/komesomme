name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - '**/*.md'
              - 'CHANGELOG'
            non_docs:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!CHANGELOG'
            data:
              - 'src/data/**'
            non_data:
              - '**'
              - '!src/data/**'
            ci_full:
              - '.github/workflows/**'
              - 'package.json'
              - 'package-lock.json'
              - 'playwright.config.ts'

      - name: Decide CI mode
        id: mode
        env:
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          DOCS: ${{ steps.filter.outputs.docs }}
          NON_DOCS: ${{ steps.filter.outputs.non_docs }}
          DATA: ${{ steps.filter.outputs.data }}
          NON_DATA: ${{ steps.filter.outputs.non_data }}
          CI_FULL: ${{ steps.filter.outputs.ci_full }}
        run: |
          if [ "$IS_MAIN_PUSH" = "true" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CI_FULL" = "true" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          elif [ "$DOCS" = "true" ] && [ "$NON_DOCS" != "true" ]; then
            echo "mode=docs_only" >> "$GITHUB_OUTPUT"
          elif [ "$DATA" = "true" ] && [ "$NON_DATA" != "true" ]; then
            echo "mode=data_only" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

  docs-check:
    needs: changes
    if: needs.changes.outputs.mode == 'docs_only'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Docs-only — skip build and E2E
        run: echo "Documentation-only diff; heavy jobs skipped."

  lint-typecheck:
    needs: changes
    if: needs.changes.outputs.mode != 'docs_only'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        if: needs.changes.outputs.mode == 'full'
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  validate:
    needs: changes
    if: needs.changes.outputs.mode != 'docs_only'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Validate rice catalogue
        run: npm run validate:rice

      - name: Unit tests
        if: needs.changes.outputs.mode == 'full'
        run: npm run test:unit

  build-e2e:
    needs: changes
    if: needs.changes.outputs.mode != 'docs_only'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('next.config.*', 'src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ci-service-placeholder
          EMBEDDING_PROVIDER: gemini
          GEMINI_API_KEY: ci-gemini-placeholder
          SEMANTIC_RECOMMEND_ENABLED: "false"
          ACCESS_LOG_ENABLED: "false"

      - name: Client bundle has no service_role
        run: npm run assert:client-bundle
        env:
          SUPABASE_SERVICE_ROLE_KEY: ci-service-placeholder

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium (full)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E tests (full)
        if: needs.changes.outputs.mode == 'full'
        run: npm run test:e2e
        env:
          CI: "true"
          SEMANTIC_RECOMMEND_ENABLED: "false"
          ACCESS_LOG_ENABLED: "false"
          SUPABASE_SERVICE_ROLE_KEY: ci-service-placeholder
          EMBEDDING_PROVIDER: gemini
          GEMINI_API_KEY: ci-gemini-placeholder

      - name: E2E smoke (data-only)
        if: needs.changes.outputs.mode == 'data_only'
        run: npx playwright test e2e/home.spec.ts e2e/library.spec.ts
        env:
          CI: "true"
          SEMANTIC_RECOMMEND_ENABLED: "false"
          ACCESS_LOG_ENABLED: "false"
          SUPABASE_SERVICE_ROLE_KEY: ci-service-placeholder
          EMBEDDING_PROVIDER: gemini
          GEMINI_API_KEY: ci-gemini-placeholder

      - name: Write test report
        if: always()
        run: npm run test:report
        continue-on-error: true

      - name: Summarise E2E failures
        if: failure()
        run: node scripts/ci-failure-summary.mjs
        continue-on-error: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  gate:
    name: lint · typecheck · validate · build
    runs-on: ubuntu-latest
    needs: [changes, docs-check, lint-typecheck, validate, build-e2e]
    if: always()
    steps:
      - name: Required check aggregate
        env:
          CHANGES: ${{ needs.changes.result }}
          MODE: ${{ needs.changes.outputs.mode }}
          DOCS: ${{ needs.docs-check.result }}
          LINT: ${{ needs.lint-typecheck.result }}
          VALIDATE: ${{ needs.validate.result }}
          BUILD: ${{ needs.build-e2e.result }}
        run: |
          ok() {
            case "$1" in
              success|skipped) return 0 ;;
              *) echo "Job $2: $1"; return 1 ;;
            esac
          }

          ok "$CHANGES" "changes" || exit 1

          if [ "$MODE" = "docs_only" ]; then
            ok "$DOCS" "docs-check" || exit 1
            exit 0
          fi

          ok "$DOCS" "docs-check" || exit 1
          ok "$LINT" "lint-typecheck" || exit 1
          ok "$VALIDATE" "validate" || exit 1
          ok "$BUILD" "build-e2e" || exit 1
