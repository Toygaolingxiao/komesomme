name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Job name must match main branch protection required check.
    name: lint · typecheck · validate · build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate rice catalogue
        run: npm run validate:rice

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ci-service-placeholder
          EMBEDDING_PROVIDER: gemini
          GEMINI_API_KEY: ci-gemini-placeholder
          SEMANTIC_RECOMMEND_ENABLED: "false"
          ACCESS_LOG_ENABLED: "false"

      - name: Client bundle has no service_role
        run: npm run assert:client-bundle
        env:
          SUPABASE_SERVICE_ROLE_KEY: ci-service-placeholder

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: "true"
          SEMANTIC_RECOMMEND_ENABLED: "false"
          ACCESS_LOG_ENABLED: "false"
          SUPABASE_SERVICE_ROLE_KEY: ci-service-placeholder
          EMBEDDING_PROVIDER: gemini
          GEMINI_API_KEY: ci-gemini-placeholder

      - name: Write test report
        if: always()
        run: npm run test:report
        continue-on-error: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
