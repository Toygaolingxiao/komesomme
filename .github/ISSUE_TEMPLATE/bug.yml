name: Bug
description: 缺陷（线上 / Preview / 本地可复现）
title: "[bug] "
labels: ["type:bug"]
body:
  - type: input
    id: wbs
    attributes:
      label: WBS / Checklist ID（可选）
      description: 例如 P0-5b；无则留空
      placeholder: P0-5b
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - P0
        - P1
        - P2
      default: 0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: Production URL / Preview / localhost
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 补充（截图、日志、相关 PR）
    validations:
      required: false
